name: Deploy ARES-7 to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Test Suite
        run: pnpm test

      - name: Generate OSDR research data
        run: node scripts/process-osdr984.mjs
        continue-on-error: true  # OSDR files may not be in CI — pre-generated JSON is committed

      - name: Typecheck & Build
        run: pnpm run build
        env:
          # Public Supabase keys — safe to expose in built JS (RLS protects data)
          # Set these in GitHub → Settings → Secrets and Variables → Actions → Variables (not Secrets)
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # NASA DEMO_KEY is intentionally public — no secret needed for GitHub Pages baseline
          # To use a private key, store it in the Supabase Edge Function (NASA_API_KEY secret)
          VITE_NASA_API_KEY: DEMO_KEY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
