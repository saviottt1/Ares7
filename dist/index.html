<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="A junior astronaut mission trainer: plan seven Sols, balance Mars outpost power, and learn from a simplified radiation and life-support model." />
    <title>ARES-7: Next-Generation Mars Colony Simulator & Junior Astronaut Mission Trainer</title>
    <link rel="icon" type="image/svg+xml" href="./assets/favicon-Brbzureh.svg" />
    <style>:root{--lightningcss-light: ;--lightningcss-dark:initial;color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}body{color:#f8fafc;background:#0f172a;min-width:320px;margin:0}.boot-screen{color:#f8fafc;text-align:center;background:#0f172a;place-content:center;justify-items:center;gap:16px;min-height:100svh;padding:24px;display:grid}.boot-mark{image-rendering:auto;filter:drop-shadow(0 0 12px #ea580c66);width:64px;height:64px}.boot-title{letter-spacing:.12em;color:#f8fafc;font-size:clamp(22px,4.5vw,32px);font-weight:900}.boot-subtitle{color:#ea580c;letter-spacing:.14em;font-size:13px;font-weight:800}.boot-motto{color:#94a3b8;max-width:380px;margin-top:-6px;font-size:13px;font-style:italic}.boot-progress{background:#1e293b;border:2px solid #eab308;border-radius:6px;width:min(320px,76vw);height:12px;overflow:hidden}.boot-progress span{background:linear-gradient(90deg,#ea580c,#eab308);width:42%;height:100%;animation:1.2s ease-in-out infinite alternate boot-progress;display:block}.boot-status{color:#cbd5e1;margin:0;font-family:monospace;font-size:14px}.boot-retry{color:#f8fafc;min-height:44px;font:inherit;cursor:pointer;background:#0f172a;border:2px solid #eab308;border-radius:8px;padding:10px 20px;font-weight:750}.boot-retry:focus-visible{outline-offset:4px;outline:3px solid #10b981}@keyframes boot-progress{0%{transform:translate(-10%)}to{transform:translate(160%)}}@media (prefers-reduced-motion:reduce){.boot-progress span{animation-duration:3s}}</style>
    <script type="module" crossorigin src="./assets/index-AkzE4-LP.js"></script>
  </head>
  <body>
    <section id="loading-screen" class="boot-screen" aria-busy="true" aria-label="Loading ARES-7 Mission Console">
      <img class="boot-mark" src="./assets/favicon-Brbzureh.svg" width="64" height="64" alt="ARES-7 Logo" />
      <strong class="boot-title">ARES-7</strong>
      <span class="boot-subtitle">NEXT-GEN MARS COLONY SIMULATOR</span>
      <span class="boot-motto">“Every watt is a decision. Every decision shapes the mission.”</span>
      <div class="boot-progress" role="progressbar" aria-label="Mission console loading"><span></span></div>
      <p id="loading-status" class="boot-status" role="status" aria-live="polite">Initializing mission console…</p>
      <button id="loading-retry" class="boot-retry" type="button" hidden>Retry loading</button>
    </section>
    <div id="app"></div>
    <noscript>This mission trainer needs JavaScript. It does not require a login or backend.</noscript>
  </body>
</html>
