<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="A junior astronaut mission trainer: plan seven Sols, balance Mars outpost power, and learn from a simplified radiation and life-support model." />
    <title>ARES-7: Next-Generation Mars Colony Simulator & Junior Astronaut Mission Trainer</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; min-width: 320px; background: #0f172a; color: #f8fafc; }
      .boot-screen { min-height: 100svh; display: grid; place-content: center; justify-items: center; gap: 16px; padding: 24px; background: #0f172a; color: #f8fafc; text-align: center; }
      .boot-mark { width: 64px; height: 64px; image-rendering: auto; filter: drop-shadow(0 0 12px rgba(234, 88, 12, 0.4)); }
      .boot-title { font-size: clamp(22px, 4.5vw, 32px); font-weight: 900; letter-spacing: .12em; color: #f8fafc; }
      .boot-subtitle { color: #ea580c; font-size: 13px; font-weight: 800; letter-spacing: .14em; }
      .boot-motto { color: #94a3b8; font-size: 13px; font-style: italic; max-width: 380px; margin-top: -6px; }
      .boot-progress { width: min(320px, 76vw); height: 12px; border: 2px solid #eab308; background: #1e293b; border-radius: 6px; overflow: hidden; }
      .boot-progress span { display: block; width: 42%; height: 100%; background: linear-gradient(90deg, #ea580c, #eab308); animation: boot-progress 1.2s ease-in-out infinite alternate; }
      .boot-status { margin: 0; color: #cbd5e1; font-size: 14px; font-family: monospace; }
      .boot-retry { min-height: 44px; padding: 10px 20px; border: 2px solid #eab308; border-radius: 8px; background: #0f172a; color: #f8fafc; font: inherit; font-weight: 750; cursor: pointer; }
      .boot-retry:focus-visible { outline: 3px solid #10b981; outline-offset: 4px; }
      @keyframes boot-progress { from { transform: translateX(-10%); } to { transform: translateX(160%); } }
      @media (prefers-reduced-motion: reduce) { .boot-progress span { animation-duration: 3s; } }
    </style>
  </head>
  <body>
    <section id="loading-screen" class="boot-screen" aria-busy="true" aria-label="Loading ARES-7 Mission Console">
      <img class="boot-mark" src="./favicon.svg" width="64" height="64" alt="ARES-7 Logo" />
      <strong class="boot-title">ARES-7</strong>
      <span class="boot-subtitle">NEXT-GEN MARS COLONY SIMULATOR</span>
      <span class="boot-motto">“Every watt is a decision. Every decision shapes the mission.”</span>
      <div class="boot-progress" role="progressbar" aria-label="Mission console loading"><span></span></div>
      <p id="loading-status" class="boot-status" role="status" aria-live="polite">Initializing mission console…</p>
      <button id="loading-retry" class="boot-retry" type="button" hidden>Retry loading</button>
    </section>
    <div id="app"></div>
    <noscript>This mission trainer needs JavaScript. It does not require a login or backend.</noscript>
    <script type="module" src="./src/bootstrap.ts"></script>
  </body>
</html>
